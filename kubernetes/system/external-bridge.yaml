---
# Home Assistant Bridge
apiVersion: v1
kind: Service
metadata:
  name: hass-external
  namespace: default
spec:
  ports:
    - protocol: TCP
      port: 8123
      targetPort: 8123
---
apiVersion: v1
kind: Endpoints
metadata:
  name: hass-external
  namespace: default
subsets:
  - addresses:
      - ip: 10.0.1.12
    ports:
      - port: 8123
---
# Immich Bridge
apiVersion: v1
kind: Service
metadata:
  name: immich-external
  namespace: default
spec:
  ports:
    - protocol: TCP
      port: 2283
      targetPort: 2283
---
apiVersion: v1
kind: Endpoints
metadata:
  name: immich-external
  namespace: default
subsets:
  - addresses:
      - ip: 10.0.1.15
    ports:
      - port: 2283
---
# AMP Game Panel Bridge
apiVersion: v1
kind: Service
metadata:
  name: amp-external
  namespace: default
spec:
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Endpoints
metadata:
  name: amp-external
  namespace: default
subsets:
  - addresses:
      - ip: 10.0.50.40
    ports:
      - port: 8080
---
# Ingress for External Services
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: external-bridge-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    kubernetes.io/ingress.class: traefik
    uptime-kuma.autodiscovery.probe.parent: "Kubernetes Apps"
spec:
  rules:
  - host: games.netnook.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: amp-external
            port:
              number: 8080
  - host: hass.netnook.cloud # Assuming your old domain for HASS
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hass-external
            port:
              number: 8123
  - host: photos.netnook.cloud # Updated domain for Immich
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: immich-external
            port:
              number: 2283
---
# Minecraft Server Bridge
apiVersion: v1
kind: Service
metadata:
  name: minecraft-external
  namespace: default
spec:
  ports:
    - name: mc-tcp
      protocol: TCP
      port: 25565
      targetPort: 25565
---
apiVersion: v1
kind: Endpoints
metadata:
  name: minecraft-external
  namespace: default
subsets:
  - addresses:
      - ip: 10.0.50.40
    ports:
      - name: mc-tcp
        port: 25565
